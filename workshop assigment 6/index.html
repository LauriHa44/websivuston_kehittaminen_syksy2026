<!DOCTYPE html>
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Oma bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body lang="en">
    <h1>Hello, world!</h1>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Brand</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Tietoa</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Yhteystiedot</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">
      <div class="row">
        <div class="col-md-4 col-12">Kolumni 1</div>
        <div class="col-md-4 col-12">Kolumni 2</div>
        <div class="col-md-4 col-12">Kolumni 3</div>
      </div>
    </div>

    <button class="btn btn-primary">Primary</button>
    <button class="btn btn-secondary">Secondary</button>
    <button class="btn btn-success">Success</button>

    <div class="card" style="width: 18rem;">
      <img src="images/card-image.jpg" class="card-img-top" alt="Card Image">
      <div class="card-body">
        <h2 class="card-title">Card Title</h2>
        <p class="card-text">This is a simple card example using Bootstrap.</p>
        <a href="#" class="btn btn-primary">Learn More</a>
      </div>
    </div>

    <div class="alert alert-warning" role="alert">
      Tama on varoitusviesti tehty Bootstrapin avulla.
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
